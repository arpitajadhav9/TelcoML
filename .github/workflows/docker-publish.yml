name: Build and Publish Docker Image to Docker Hub

"on":
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build & Publish to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      - name: Ensure dataset is available for DVC pipeline
        run: |
          test -f Dataset/WA_Fn-UseC_-Telco-Customer-Churn.csv || {
            echo "Dataset file not found!"
            exit 1
          }
          echo "Dataset successfully verified."

      - name: Run DVC pipeline to generate model
        run: |
          dvc repro

      - name: Verify trained model artifact exists
        run: |
          test -f models/model.joblib || { echo "models/model.joblib not found!"; exit 1; }
          ls -lh models/model.joblib
          echo "models/model.joblib verified successfully."

      - name: Run test suite
        run: |
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            arpita1965/telco-churn-ml:latest
            arpita1965/telco-churn-ml:${{ github.sha }}
